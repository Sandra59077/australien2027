<head>
<meta charset="UTF-8">

<title>Australien & Tasmanien 2026/27</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦘</text></svg>">
<style>
:root{
  --teal:#0b4f55; --teal-2:#0e6a72; --coral:#ff6b57; --sand:#f7f4ee; --card:#ffffff;
  --ink:#1d2b2d; --muted:#6b7a7c; --line:#e6e1d8;
  --green:#1e8e5a; --amber:#c98a1b; --red:#d94f3d; --blue:#3272b5; --gray:#7d8a8c;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--sand);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:16px}
body{padding-bottom:calc(70px + env(safe-area-inset-bottom))}
a{color:var(--teal-2)}
button{font:inherit;border:none;background:none;cursor:pointer}
/* Header */
header{background:linear-gradient(135deg,#0b4f55 0%,#0e6a72 55%,#128089 100%);color:#fff;
  padding:calc(14px + env(safe-area-inset-top)) 18px 16px;border-radius:0 0 22px 22px;position:relative;overflow:hidden}
header::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.07)}
header::before{content:"";position:absolute;right:30px;bottom:-60px;width:120px;height:120px;border-radius:50%;background:rgba(255,107,87,.18)}
.h-kicker{font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.75}
h1{font-size:22px;font-weight:800;margin:2px 0 4px}
.h-sub{font-size:13px;opacity:.85}
.h-chips{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;position:relative;z-index:1}
.chip{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:4px 11px;font-size:12px;font-weight:600}
.chip.sync-ok{background:rgba(30,142,90,.35)}
.chip.sync-err{background:rgba(217,79,61,.4)}
/* Layout */
main{padding:14px 14px 20px;max-width:640px;margin:0 auto}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(29,43,45,.06);border:1px solid rgba(230,225,216,.7)}
h2{font-size:17px;margin:14px 2px 8px;font-weight:800}
h2:first-child{margin-top:2px}
.muted{color:var(--muted);font-size:13px}
.small{font-size:12px}
/* Section pills */
.pills{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;-webkit-overflow-scrolling:touch}
.pill{flex:0 0 auto;border-radius:999px;padding:7px 13px;font-size:13px;font-weight:700;background:#fff;border:1px solid var(--line);color:var(--muted)}
.pill.on{background:var(--teal);color:#fff;border-color:var(--teal)}
/* Day card */
.day{display:flex;gap:12px;align-items:flex-start}
.dnum{flex:0 0 auto;width:44px;height:44px;border-radius:14px;background:var(--sand);border:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}
.dnum b{font-size:16px}.dnum span{font-size:10px;color:var(--muted);text-transform:uppercase}
.day.today .dnum{background:var(--coral);border-color:var(--coral);color:#fff}
.day.today .dnum span{color:rgba(255,255,255,.85)}
.dbody{flex:1;min-width:0}
.dtitle{font-weight:700;font-size:15px}
.dmeta{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.tag{font-size:11px;font-weight:600;border-radius:6px;padding:2px 7px;background:var(--sand);color:var(--muted);border:1px solid var(--line)}
.tag.stay{background:#eaf3f0;color:var(--green);border-color:#d2e6dd}
.tag.drive{background:#f0f4fa;color:var(--blue);border-color:#dbe5f2}
.tag.note{background:#fdf1e3;color:var(--amber);border-color:#f3e2c5}
.chev{color:#c6c0b4;font-size:18px;align-self:center}
/* Status badge */
.badge{font-size:11px;font-weight:700;border-radius:999px;padding:3px 9px;color:#fff;white-space:nowrap}
.st-gebucht{background:var(--green)}.st-offen{background:var(--red)}.st-angefragt{background:var(--amber)}.st-klären,.st-pruefen{background:var(--gray)}
/* Booking card */
.bk{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.bk .bname{font-weight:700;font-size:15px}
.bk .bmeta{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.45}
/* Checklist */
.ck{display:flex;gap:11px;align-items:flex-start}
.ckbox{flex:0 0 auto;width:24px;height:24px;border-radius:8px;border:2px solid #cfc9bc;background:#fff;margin-top:1px;
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px}
.ck.done .ckbox{background:var(--green);border-color:var(--green)}
.ck.done .cktxt{text-decoration:line-through;color:var(--muted)}
.cktxt{flex:1;font-size:14.5px;line-height:1.4}
.ckdue{font-size:11.5px;color:var(--amber);font-weight:600}
/* Budget */
.bsum{display:flex;gap:8px}
.bsum .bx{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.bx .v{font-size:17px;font-weight:800}.bx .l{font-size:11px;color:var(--muted);margin-top:1px}
.bent{display:flex;justify-content:space-between;gap:8px;align-items:center}
.bent .amt{font-weight:800;white-space:nowrap}
/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;padding:11px 16px;font-weight:700;font-size:14.5px}
.btn-p{background:var(--teal);color:#fff}
.btn-c{background:var(--coral);color:#fff}
.btn-o{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
.btn-sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn:active{opacity:.75}
.fab{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));width:54px;height:54px;border-radius:50%;
  background:var(--coral);color:#fff;font-size:28px;box-shadow:0 4px 14px rgba(255,107,87,.45);z-index:30;display:flex;align-items:center;justify-content:center;line-height:1}
/* Bottom nav */
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:40}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 0;color:var(--muted);font-size:10.5px;font-weight:600}
nav button .ic{font-size:21px;line-height:1}
nav button.on{color:var(--teal)}
/* Modal */
.ovl{position:fixed;inset:0;background:rgba(20,30,32,.5);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--sand);width:100%;max-width:640px;max-height:88vh;border-radius:20px 20px 0 0;overflow-y:auto;
  padding:16px 16px calc(24px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.sheet h3{font-size:18px;font-weight:800;margin-bottom:2px;padding-right:40px}
.xbtn{position:absolute;right:14px;top:12px;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.08);font-size:16px;color:var(--muted)}
.sheet-wrap{position:relative}
label.f{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin:12px 0 4px}
input,textarea,select{width:100%;border:1.5px solid var(--line);border-radius:11px;padding:10px 12px;font:inherit;font-size:15px;background:#fff;color:var(--ink)}
textarea{min-height:84px;line-height:1.45}
.row2{display:flex;gap:8px}.row2>*{flex:1}
.mact{display:flex;gap:8px;margin-top:18px}
.mact .btn{flex:1}
.linklist a{display:flex;align-items:center;gap:7px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14.5px;font-weight:600;text-decoration:none}
.linklist a:last-child{border-bottom:none}
.prog{white-space:pre-wrap;line-height:1.55;font-size:14.5px}
.notebox{background:#fdf8ec;border:1px solid #f0e6c8;border-radius:12px;padding:10px 12px;font-size:14px;white-space:pre-wrap;line-height:1.5}
.empty{text-align:center;color:var(--muted);padding:30px 10px;font-size:14px}
.seghead{display:flex;justify-content:space-between;align-items:center;margin:16px 2px 8px}
.seghead h2{margin:0}
.del{color:var(--red);font-weight:700;font-size:13.5px}
.sync-row{display:flex;gap:8px;margin-top:12px}
.sync-row .btn{flex:1}
hr.sp{border:none;border-top:1px solid var(--line);margin:16px 0}
</style>
</head>

/* ================= SYNC (GitHub) ================= */
function b64enc(str){
  const bytes = new TextEncoder().encode(str);
  let bin = ""; const CH = 0x8000;
  for (let i=0;i<bytes.length;i+=CH) bin += String.fromCharCode.apply(null, bytes.subarray(i,i+CH));
  return btoa(bin);
}
function b64dec(b64){
  const bin = atob(b64.replace(/\s/g,""));
  const bytes = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
function ghUrl(){ return `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${cfg.path||"data.json"}?ref=${cfg.branch||"main"}`; }
function ghHeaders(){
  const h = {"Accept":"application/vnd.github+json"};
  if (cfg.token) h["Authorization"] = "Bearer " + cfg.token.trim();
  return h;
}
function setSync(s){ syncState = s; renderHeader(); }

async function pull(silent){
  if (!cfg.owner || !cfg.repo){ if(!silent) alert("Zuerst unter „Mehr“ Repo einrichten."); return false; }
  try{
    setSync("lädt…");
    const res = await fetch(ghUrl() + "&t=" + Date.now(), {headers: ghHeaders(), cache:"no-store"});
    if (res.status === 404){ setSync("keine Daten online"); ghSha = null; return false; }
    if (!res.ok) throw new Error("HTTP " + res.status);
    const j = await res.json();
    ghSha = j.sha;
    const remote = JSON.parse(b64dec(j.content));
    lastRemoteStamp = remote.updatedAt || "";
    if (!data.updatedAt || (remote.updatedAt && remote.updatedAt > data.updatedAt)){
      data = remote; saveLocal(); render();
    }
    setSync("synchron ✓");
    return true;
  }catch(e){ setSync("offline/Fehler"); if(!silent) alert("Sync-Fehler beim Laden: " + e.message); return false; }
}

async function push(silent){
  if (!cfg.owner || !cfg.repo || !cfg.token){ if(!silent) alert("Zuerst unter „Mehr“ Repo + Token einrichten."); return; }
  try{
    setSync("speichert…");
    // frische sha holen + Konflikt erkennen
    const res = await fetch(ghUrl() + "&t=" + Date.now(), {headers: ghHeaders(), cache:"no-store"});
    if (res.ok){
      const j = await res.json();
      ghSha = j.sha;
      try{
        const remote = JSON.parse(b64dec(j.content));
        if (remote.updatedAt && lastRemoteStamp && remote.updatedAt > lastRemoteStamp && remote.updatedAt > data.updatedAt){
          if (!confirm("Auf GitHub gibt es neuere Änderungen (vom anderen Gerät?). Trotzdem mit diesem Stand überschreiben?\n\nAbbrechen = erst neuere Version laden.")){
            data = remote; lastRemoteStamp = remote.updatedAt; saveLocal(); render(); setSync("synchron ✓"); return;
          }
        }
      }catch(e){}
    } else if (res.status !== 404){ throw new Error("HTTP " + res.status); }
    const body = {message:"Reise-App: Daten aktualisiert " + new Date().toLocaleString("de-DE"),
      content: b64enc(JSON.stringify(data, null, 1)), branch: cfg.branch || "main"};
    if (ghSha) body.sha = ghSha;
    const put = await fetch(ghUrl().split("?")[0], {method:"PUT", headers: ghHeaders(), body: JSON.stringify(body)});
    if (!put.ok){ const t = await put.text(); throw new Error("HTTP " + put.status + " " + t.slice(0,120)); }
    const pj = await put.json();
    ghSha = pj.content && pj.content.sha;
    lastRemoteStamp = data.updatedAt;
    setSync("synchron ✓");
  }catch(e){ setSync("Sync-Fehler"); if(!silent) alert("Sync-Fehler beim Speichern: " + e.message); }
}

/* ================= HELPERS ================= */
const $ = id => document.getElementById(id);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const WD = ["So","Mo","Di","Mi","Do","Fr","Sa"];
function fmtDate(iso){
  const d = new Date(iso + "T12:00:00");
  return WD[d.getDay()] + " " + String(d.getDate()).padStart(2,"0") + "." + String(d.getMonth()+1).padStart(2,"0") + ".";
}
function todayISO(){ const d = new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function uid(p){ return p + Math.random().toString(36).slice(2,8); }
function stCls(s){ return "st-" + (s==="prüfen"?"pruefen":s); }
function badge(s){ return `<span class="badge ${stCls(s)}">${esc(s)}</span>`; }
function linkRow(l){ return `<a href="${esc(l.u)}" target="_blank" rel="noopener">🔗 <span>${esc(l.t)}</span></a>`; }

/* ================= RENDER ================= */
function renderHeader(){
  const today = todayISO();
  let cd;
  if (today < data.meta.start){
    const days = Math.round((new Date(data.meta.start) - new Date(today)) / 864e5);
    cd = "✈ noch " + days + " Tage";
  } else if (today <= data.meta.end){
    const d = data.days.find(x=>x.date===today);
    cd = d ? ("Heute: Tag " + d.n + " · " + d.title) : "Unterwegs!";
  } else cd = "Reise beendet 🌏";
  const sChip = cfg.owner ? `<span class="chip ${syncState.includes("✓")?"sync-ok":(syncState.includes("Fehler")||syncState.includes("offline")?"sync-err":"")}" onclick="pull(false)">☁ ${esc(syncState)}</span>` : "";
  $("hdr").innerHTML = `
    <div class="h-kicker">Reisebegleiter</div>
    <h1>${esc(data.meta.title)} <span style="font-weight:400">2026/27</span></h1>
    <div class="h-sub">${esc(data.meta.sub)}</div>
    <div class="h-chips"><span class="chip">${esc(cd)}</span>${sChip}</div>`;
}

  const b = id ? list.find(x=>x.id===id) : {name:"",loc:"",typ:isStay?"":"Flug",dates:"",status:"offen",price:"",url:"",tel:"",conf:"",note:""};
  const stOpts = ["offen","angefragt","gebucht","klären"].map(s=>`<option ${b.status===s?"selected":""}>${s}</option>`).join("");
  const kindSel = id ? "" : `<label class="f">Kategorie</label><select id="f_kind"><option value="stay" ${isStay?"selected":""}>Übernachtung</option><option value="trans" ${!isStay?"selected":""}>Transport / Pass</option></select>`;
  sheet(`
    <h3>${id?"Buchung bearbeiten":"Neue Buchung"}</h3>
    ${kindSel}
    <label class="f">Name</label><input id="f_name" value="${esc(b.name)}" placeholder="z. B. Lorne Foreshore Caravan Park">
    <div class="row2">
      <div><label class="f">Zeitraum</label><input id="f_dates" value="${esc(b.dates)}" placeholder="13.–15.01. (2 N)"></div>
      <div><label class="f">Status</label><select id="f_status">${stOpts}</select></div>
    </div>
    <div class="row2">
      <div><label class="f">${isStay?"Ort":"Typ (Flug/Camper/…)"}</label><input id="f_lt" value="${esc(isStay?b.loc:(b.typ||""))}"></div>
      <div><label class="f">Preis</label><input id="f_price" value="${esc(b.price)}"></div>
    </div>
    <label class="f">Link (Buchungsseite)</label><input id="f_url" value="${esc(b.url)}" placeholder="https://…">
    <div class="row2">
      <div><label class="f">Telefon</label><input id="f_tel" value="${esc(b.tel||"")}"></div>
      <div><label class="f">Buchungsnr.</label><input id="f_conf" value="${esc(b.conf||"")}"></div>
    </div>
    <label class="f">Notiz</label><textarea id="f_bnote">${esc(b.note)}</textarea>
    <div class="mact"><button class="btn btn-o" onclick="closeSheet()">Abbrechen</button>
    <button class="btn btn-p" onclick="saveBooking('${id||""}','${kind}')">Speichern</button></div>`);
}
function saveBooking(id, kind){
  let realKind = kind;
  if (!id && $("f_kind")) realKind = $("f_kind").value;
  const isStay = realKind==="stay";
  const list = isStay ? data.stays : data.transport;
  let b;
  if (id){
    const oldList = kind==="stay" ? data.stays : data.transport;
    b = oldList.find(x=>x.id===id);
  } else { b = {id:uid(isStay?"s":"t")}; list.push(b); }
  b.name = $("f_name").value.trim();
  b.dates = $("f_dates").value.trim();
  b.status = $("f_status").value;
  if (isStay) b.loc = $("f_lt").value.trim(); else b.typ = $("f_lt").value.trim();
  b.price = $("f_price").value.trim();
  b.url = $("f_url").value.trim();
  b.tel = $("f_tel").value.trim();
  b.conf = $("f_conf").value.trim();
  b.note = $("f_bnote").value.trim();
  markDirty(); closeSheet(); render();
}
function delBooking(id, kind){
  if (!confirm("Diesen Eintrag wirklich löschen?")) return;
  if (kind==="stay") data.stays = data.stays.filter(x=>x.id!==id);
  else data.transport = data.transport.filter(x=>x.id!==id);
  markDirty(); closeSheet(); render();
}

/* ---- Budget ---- */
function renderBudget(m){
  const rate = data.meta.rate || 0.6;
  const toEur = e => e.cur==="EUR" ? e.amt : e.amt * rate;
  const total = data.budget.reduce((s,e)=>s+toEur(e),0);
  const dates = [...new Set(data.budget.map(e=>e.date))];
  const avg = dates.length ? total/dates.length : 0;
  const bpd = data.meta.budgetPerDay || 300;
  const entries = [...data.budget].sort((a,b)=>b.date.localeCompare(a.date));
  let h = `<div class="bsum">
      <div class="bx"><div class="v">${total.toFixed(0)} €</div><div class="l">ausgegeben</div></div>
      <div class="bx"><div class="v" style="color:${avg>bpd?"var(--red)":"var(--green)"}">${avg.toFixed(0)} €</div><div class="l">Ø pro Tag</div></div>
      <div class="bx"><div class="v">${bpd} €</div><div class="l">Budget/Tag</div></div>
    </div>
    <div class="muted small" style="margin:8px 4px">Kurs: 1 AUD = ${rate.toFixed(2)} € · <a href="#" onclick="budgetSettings();return false">Budget & Kurs ändern</a></div>
    <h2>Ausgaben</h2>`;
  if (!entries.length) h += `<div class="empty">Noch keine Ausgaben erfasst.<br>Mit + unten rechts loslegen.</div>`;
  for (const e of entries){
    h += `<div class="card bent" onclick="editBudget('${e.id}')">
      <div><b>${esc(e.desc)}</b><div class="muted small">${esc(fmtDate(e.date))} · ${esc(e.cat)}</div></div>
      <div class="amt">${e.amt.toFixed(2)} ${e.cur}${e.cur==="AUD"?`<div class="muted small" style="text-align:right;font-weight:400">≈ ${toEur(e).toFixed(0)} €</div>`:""}</div></div>`;
  }
  m.innerHTML = h;
}
function budgetSettings(){
  sheet(`<h3>Budget-Einstellungen</h3>
    <div class="row2">
      <div><label class="f">Budget pro Tag (€)</label><input id="f_bpd" type="number" value="${data.meta.budgetPerDay||300}"></div>
      <div><label class="f">Kurs 1 AUD in €</label><input id="f_rate" type="number" step="0.01" value="${data.meta.rate||0.6}"></div>
    </div>
    <div class="mact"><button class="btn btn-o" onclick="closeSheet()">Abbrechen</button>
    <button class="btn btn-p" onclick="saveBudgetSettings()">Speichern</button></div>`);
}
function saveBudgetSettings(){
  data.meta.budgetPerDay = parseFloat($("f_bpd").value)||300;
  data.meta.rate = parseFloat($("f_rate").value)||0.6;
  markDirty(); closeSheet(); render();
}
function editBudget(id){
  const e = id ? data.budget.find(x=>x.id===id) : {date:todayISO(),desc:"",amt:"",cur:"AUD",cat:"Essen"};
  const cats = ["Essen","Camping/Hotel","Sprit","Aktivitäten","Transport","Einkauf","Sonstiges"].map(c=>`<option ${e.cat===c?"selected":""}>${c}</option>`).join("");
  sheet(`<h3>${id?"Ausgabe bearbeiten":"Neue Ausgabe"}</h3>
    <label class="f">Beschreibung</label><input id="f_desc" value="${esc(e.desc)}" placeholder="z. B. Abendessen Apollo Bay">
    <div class="row2">
      <div><label class="f">Betrag</label><input id="f_amt" type="number" step="0.01" inputmode="decimal" value="${e.amt}"></div>
      <div><label class="f">Währung</label><select id="f_cur"><option ${e.cur==="AUD"?"selected":""}>AUD</option><option ${e.cur==="EUR"?"selected":""}>EUR</option></select></div>
    </div>
    <div class="row2">
      <div><label class="f">Datum</label><input id="f_date" type="date" value="${e.date}"></div>
      <div><label class="f">Kategorie</label><select id="f_cat">${cats}</select></div>
    </div>
    <div class="mact">
      ${id?`<button class="btn btn-o del" onclick="delBudget('${id}')">Löschen</button>`:`<button class="btn btn-o" onclick="closeSheet()">Abbrechen</button>`}
      <button class="btn btn-p" onclick="saveBudget('${id||""}')">Speichern</button>
    </div>`);
}
function saveBudget(id){
  const amt = parseFloat($("f_amt").value);
  if (!amt || !$("f_desc").value.trim()){ alert("Bitte Beschreibung und Betrag angeben."); return; }
  let e;
  if (id) e = data.budget.find(x=>x.id===id);
  else { e = {id:uid("b")}; data.budget.push(e); }
  e.desc = $("f_desc").value.trim(); e.amt = amt; e.cur = $("f_cur").value;
  e.date = $("f_date").value || todayISO(); e.cat = $("f_cat").value;
  markDirty(); closeSheet(); render();
}
function delBudget(id){
  data.budget = data.budget.filter(x=>x.id!==id);
  markDirty(); closeSheet(); render();
}

/* ---- Checkliste ---- */
function renderCheck(m){
  const open = data.checklist.filter(c=>!c.done), done = data.checklist.filter(c=>c.done);
  const row = c => `<div class="card ck ${c.done?"done":""}">
      <button class="ckbox" onclick="toggleCheck('${c.id}')">${c.done?"✓":""}</button>
      <div class="cktxt" onclick="editCheck('${c.id}')">${esc(c.txt)}${c.due?`<div class="ckdue">⏰ ${esc(c.due)}</div>`:""}</div>
    </div>`;
  let h = `<div class="card" style="background:#eef4f2"><b>${open.length}</b> <span class="muted">offen · ${done.length} erledigt</span></div>`;
  h += open.map(row).join("");
  if (done.length) h += `<h2>Erledigt</h2>` + done.map(row).join("");
  m.innerHTML = h;
}
function toggleCheck(id){
  const c = data.checklist.find(x=>x.id===id);
  c.done = !c.done; markDirty(); render();
}
function editCheck(id){
  const c = id ? data.checklist.find(x=>x.id===id) : {txt:"",due:"",done:false};
  sheet(`<h3>${id?"To-do bearbeiten":"Neues To-do"}</h3>
    <label class="f">Aufgabe</label><textarea id="f_txt" style="min-height:70px">${esc(c.txt)}</textarea>
    <label class="f">Fällig / Hinweis (optional)</label><input id="f_due" value="${esc(c.due)}" placeholder="z. B. Nov 2026">
    <div class="mact">
      ${id?`<button class="btn btn-o del" onclick="delCheck('${id}')">Löschen</button>`:`<button class="btn btn-o" onclick="closeSheet()">Abbrechen</button>`}
      <button class="btn btn-p" onclick="saveCheck('${id||""}')">Speichern</button>
    </div>`);
}
function saveCheck(id){
  const txt = $("f_txt").value.trim();
  if (!txt) return;
  let c;
  if (id) c = data.checklist.find(x=>x.id===id);
  else { c = {id:uid("c"), done:false}; data.checklist.push(c); }
  c.txt = txt; c.due = $("f_due").value.trim();
  markDirty(); closeSheet(); render();
}
function delCheck(id){
  data.checklist = data.checklist.filter(x=>x.id!==id);
  markDirty(); closeSheet(); render();
}

/* ---- Mehr / Sync ---- */
function renderMehr(m){
  m.innerHTML = `
    <h2>☁ Synchronisation (GitHub)</h2>
    <div class="card">
      <div class="small muted" style="margin-bottom:4px">Beide iPhones synchronisieren über euer GitHub-Repo. Einrichtung: siehe ANLEITUNG.md im Repo.</div>
      <div class="row2">
        <div><label class="f">GitHub-Benutzername</label><input id="c_owner" value="${esc(cfg.owner||"")}" autocapitalize="off"></div>
        <div><label class="f">Repo-Name</label><input id="c_repo" value="${esc(cfg.repo||"")}" autocapitalize="off" placeholder="reise-australien"></div>
      </div>
      <label class="f">Token (fine-grained, nur dieses Repo, Contents: Read & Write)</label>
      <input id="c_token" type="password" value="${esc(cfg.token||"")}" autocapitalize="off" placeholder="github_pat_…">
      <label class="f" style="display:flex;align-items:center;gap:8px;margin-top:14px">
        <input type="checkbox" id="c_auto" style="width:auto" ${cfg.auto?"checked":""}> Automatisch synchronisieren
      </label>
      <div class="sync-row">
        <button class="btn btn-p" onclick="saveSyncCfg()">Speichern</button>
      </div>
      <div class="sync-row">
        <button class="btn btn-o" onclick="pull(false)">⬇ Laden</button>
        <button class="btn btn-o" onclick="push(false)">⬆ Hochladen</button>
      </div>
      <div class="small muted" style="margin-top:8px">Status: ${esc(syncState)}</div>
    </div>
    <h2>💾 Backup</h2>
    <div class="card">
      <div class="sync-row" style="margin-top:0">
        <button class="btn btn-o" onclick="exportJson()">Export (Datei)</button>
        <button class="btn btn-o" onclick="$('imp').click()">Import</button>
      </div>
      <input type="file" id="imp" accept=".json" style="display:none" onchange="importJson(event)">
      <button class="btn btn-o del" style="width:100%;margin-top:8px" onclick="resetData()">Auf Ausgangsplan zurücksetzen</button>
    </div>
    <h2>ℹ️ Reise</h2>
    <div class="card small" style="line-height:1.7">
      <b>${esc(data.meta.title)} 2026/27</b><br>${esc(data.meta.sub)}<br>
      ${esc(data.meta.variant)}<br>
      Budget vor Ort: ~250–350 €/Tag · Stil: Natur & Wandern, Campervan<br><br>
      <span class="muted">Stand der Daten: ${data.updatedAt ? new Date(data.updatedAt).toLocaleString("de-DE") : "–"}</span>
    </div>`;
}
function saveSyncCfg(){
  cfg.owner = $("c_owner").value.trim();
  cfg.repo = $("c_repo").value.trim();
  cfg.token = $("c_token").value.trim();
  cfg.branch = "main"; cfg.path = "data.json";
  cfg.auto = $("c_auto").checked;
  saveCfg();
  if (cfg.owner && cfg.repo) pull(false);
  render();
}
function exportJson(){
  const blob = new Blob([JSON.stringify(data,null,2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "reise-australien-backup.json";
  a.click();
}
function importJson(ev){
  const f = ev.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const d = JSON.parse(r.result);
      if (!d.days) throw new Error("Ungültiges Format");
      data = d; markDirty(); render(); alert("Import erfolgreich.");
    }catch(e){ alert("Import fehlgeschlagen: " + e.message); }
  };
  r.readAsText(f);
}
function resetData(){
  if (!confirm("Wirklich alle Änderungen verwerfen und den Ausgangsplan laden?")) return;
  data = JSON.parse(JSON.stringify(DEFAULT_DATA));
  markDirty(); render();
}

/* ---- Modal ---- */
function sheet(inner){
  $("modal").innerHTML = `<div class="ovl" onclick="if(event.target===this)closeSheet()">
    <div class="sheet"><div class="sheet-wrap"><button class="xbtn" onclick="closeSheet()">✕</button>${inner}</div></div></div>`;
  document.body.style.overflow = "hidden";
}
function closeSheet(){ $("modal").innerHTML = ""; document.body.style.overflow = ""; }

/* ---- Init ---- */
render();
if (cfg.owner && cfg.repo) pull(true);
if ("serviceWorker" in navigator && location.protocol === "https:"){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
</script>
</body>
</html>
